name: Update data and deploy dashboard

on:
  schedule:
    # 16th of every month, 14:00 UTC (NPS posts the prior month around the 15th)
    - cron: "0 14 16 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "config/**", "docs/index.html", ".github/workflows/update-data.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Fetch Library admissions from the Marketing Dashboard's ACME extract
        run: python scripts/fetch_library.py
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        continue-on-error: true
      - name: Fetch NPS IRMA monthly visits
        run: python scripts/fetch_nps.py
        continue-on-error: true
      - name: Fetch BTS border crossings
        run: python scripts/fetch_bts_border.py
        continue-on-error: true
      - name: Fetch airport passengers (BTS T-100 monthly + FAA annual)
        run: python scripts/fetch_airports.py
        continue-on-error: true
      - name: Fetch NDDOT monthly traffic counts (I-94 at Medora)
        run: python scripts/fetch_nddot_atr.py
        continue-on-error: true
      - name: Fetch ND taxable sales (quarterly, by county)
        run: python scripts/fetch_nd_tax.py
        continue-on-error: true
      - name: Fetch ND Treasurer city tax distributions (Medora + corridor towns)
        run: python scripts/fetch_nd_treasurer.py
        continue-on-error: true
      - name: Fetch MT ITRR nonresident visitation and survey shares
        run: python scripts/fetch_mt_itrr.py
        continue-on-error: true
      - name: Fetch WY county travel impacts (Dean Runyan PDF)
        run: python scripts/fetch_wy_impacts.py
        continue-on-error: true
      - name: Fetch BLS QCEW county tourism employment
        run: python scripts/fetch_qcew.py
        continue-on-error: true
      - name: Fetch Recreation.gov campground aggregates (new fiscal years only)
        run: python scripts/fetch_recgov.py
        continue-on-error: true
      - name: Fetch Wikipedia pageviews and Google Trends
        run: python scripts/fetch_interest.py
        continue-on-error: true
      - name: Fetch controls (weather, gas, CAD, ND oil)
        run: python scripts/fetch_controls.py
        continue-on-error: true

      - name: Build dashboard data
        run: python scripts/build.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
