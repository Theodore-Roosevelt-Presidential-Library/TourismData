<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRPL Visitor Trends</title>
<meta name="description" content="Visitation around the Theodore Roosevelt Presidential Library and across North Dakota, Montana, South Dakota, Wyoming and Canada: park visits, roads, airports, taxes, jobs and international arrivals.">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --good: #006300; --bad: #d03b3b;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
    --seq-a:#86b6ef; --seq-b:#2a78d6; --seq-c:#104281; --band: rgba(42,120,214,0.14); --gray-mark:#c3c2b7;
    --nav-bg: rgba(249,249,247,0.92); --chip: #efeee9;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border: rgba(255,255,255,0.10); --good:#0ca30c; --bad:#e66767;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --seq-a:#184f95; --seq-b:#3987e5; --seq-c:#9ec5f4; --band: rgba(57,135,229,0.18); --gray-mark:#52514e;
    --nav-bg: rgba(13,13,13,0.9); --chip: #262624;
  } }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border: rgba(255,255,255,0.10); --good:#0ca30c; --bad:#e66767;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --seq-a:#184f95; --seq-b:#3987e5; --seq-c:#9ec5f4; --band: rgba(57,135,229,0.18); --gray-mark:#52514e;
    --nav-bg: rgba(13,13,13,0.9); --chip: #262624;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 64px; }
  body { margin:0; background:var(--page); color:var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap, main, footer { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
  .top { padding-top: 28px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); margin: 0 0 18px; }
  .sub b { color: var(--ink); font-weight: 600; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 0 0 18px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .tile .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .tile .v { font-size: 28px; font-weight: 600; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
  .tile .d { font-size: 13px; color: var(--ink-2); }
  .up { color: var(--good); font-weight: 600; } .down { color: var(--bad); font-weight: 600; }

  /* Section menu */
  nav.menu { position: sticky; top: 0; z-index: 10; background: var(--nav-bg); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
  nav.menu .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-top: 8px; padding-bottom: 8px; }
  nav.menu .wrap::-webkit-scrollbar { display: none; }
  nav.menu a { flex: 0 0 auto; color: var(--ink-2); text-decoration: none; font-size: 13.5px; padding: 6px 11px; border-radius: 999px; white-space: nowrap; }
  nav.menu a:hover { color: var(--ink); background: var(--chip); }
  nav.menu a.on { color: var(--ink); background: var(--chip); font-weight: 600; }

  /* What moved */
  .movers { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px 6px; margin: 18px 0 8px; }
  .movers:empty { display: none; }
  .movers h2 { font-size: 17px; margin: 0 0 2px; }
  .movers p.note { margin: 0; color: var(--ink-2); font-size: 13px; }
  .movers ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); column-gap: 24px; }
  .movers li a { display: grid; grid-template-columns: 64px 1fr; column-gap: 10px; padding: 7px 0; border-top: 1px solid var(--grid); color: inherit; text-decoration: none; }
  .movers li a:hover .mv-label { text-decoration: underline; }
  .mv-pct { grid-row: span 2; font-variant-numeric: tabular-nums; text-align: right; font-size: 15px; }
  .mv-label { font-size: 14px; }
  .mv-meta { font-size: 12px; color: var(--muted); }

  /* Sections */
  section.sec { padding-top: 26px; }
  .sec-head { border-top: 2px solid var(--ink); padding-top: 12px; margin-bottom: 14px; }
  .sec-head h2 { font-size: 22px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sec-head p { margin: 0; color: var(--ink-2); max-width: 760px; }
  .sec-head .src { margin-top: 10px; font-size: 13px; color: var(--muted); max-width: 760px; }
  .sec-head .src b { color: var(--ink-2); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .sec-head .src ul { margin: 4px 0 4px; padding-left: 18px; }
  .sec-head .src li { margin: 1px 0; }
  .sec-head .src p { color: var(--muted); font-size: 12.5px; }
  .sec-head .src a, .fresh a { color: var(--ink-2); }
  .src-what { color: var(--muted); }
  .group { margin: 22px 0 10px; }
  .group h3 { font-size: 13px; margin: 0; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
  .group p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; max-width: 760px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 16px 8px; margin: 0 0 18px; min-width: 0; }
  .card h2 { font-size: 17px; margin: 0 0 2px; }
  .card p.note { margin: 0 0 10px; color: var(--ink-2); font-size: 13px; }
  .card .bar { display:flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .toggle { font: inherit; font-size: 13px; color: var(--ink-2); background: none; border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .toggle:hover { color: var(--ink); }
  .plot { width: 100%; min-height: 340px; }
  .slider { padding: 10px 4px 2px; }
  .slider label { font-size: 13px; color: var(--ink-2); display: block; margin-bottom: 4px; }
  .slider input[type=range] { width: 100%; accent-color: var(--s1); }
  .slider .ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .fresh { font-size: 11.5px; color: var(--muted); margin: 2px 0 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .badge { display: inline-block; font-size: 11px; color: var(--ink-2); background: var(--chip); border-radius: 4px; padding: 1px 6px; }
  .badge.muted { color: var(--muted); }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 8px 0 12px; }
  th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; vertical-align: top; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; }
  table.summary td, table.summary th { text-align: left; min-width: 150px; }
  table.summary td:first-child { min-width: 120px; }
  table.sources td, table.sources th { text-align: left; }
  .sub2 { font-size: 11.5px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  td.na { color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .hidden { display: none; }
  code { font-size: 12px; }
  footer { color: var(--muted); font-size: 12.5px; padding: 12px 16px 40px; }
  footer a, .card a, .movers a { color: var(--ink-2); }
  .flag { display:inline-block; font-size: 11px; color: var(--ink-2); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: middle; }
  @media (max-width: 560px) {
    h1 { font-size: 22px; }
    .tile .v { font-size: 24px; }
    .movers ul { grid-template-columns: 1fr; }
    .plot { min-height: 300px; }
  }
</style>
</head>
<body>
<div class="wrap top">
  <h1>TRPL Visitor Trends</h1>
  <p class="sub" id="subtitle">Loading…</p>
  <div class="tiles" id="tiles"></div>
</div>
<nav class="menu" aria-label="Sections"><div class="wrap" id="nav"></div></nav>
<div class="wrap"><div class="movers" id="movers"></div></div>
<main id="main"></main>
<footer id="footer"></footer>
<script src="js/core.js"></script>
<script src="js/sec-library.js"></script>
<script src="js/sec-park.js"></script>
<script src="js/sec-travel.js"></script>
<script src="js/sec-economy.js"></script>
<script src="js/sec-region.js"></script>
<script src="js/sec-context.js"></script>
<script src="js/main.js"></script>
</body>
</html>
