<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRPL Visitor Trends</title>
<meta name="description" content="Regional visitation indicators around the Theodore Roosevelt Presidential Library: NPS park visits, Canadian border crossings, airport enplanements.">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --good: #006300; --bad: #d03b3b;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
    --seq-a:#86b6ef; --seq-b:#2a78d6; --seq-c:#104281; --band: rgba(42,120,214,0.14); --gray-mark:#c3c2b7;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border: rgba(255,255,255,0.10); --good:#0ca30c; --bad:#e66767;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --seq-a:#184f95; --seq-b:#3987e5; --seq-c:#9ec5f4; --band: rgba(57,135,229,0.18); --gray-mark:#52514e;
  } }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border: rgba(255,255,255,0.10); --good:#0ca30c; --bad:#e66767;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --seq-a:#184f95; --seq-b:#3987e5; --seq-c:#9ec5f4; --band: rgba(57,135,229,0.18); --gray-mark:#52514e;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--page); color:var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header, main, footer { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
  header { padding-top: 28px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); margin: 0 0 18px; }
  .sub b { color: var(--ink); font-weight: 600; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin: 0 0 24px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .tile .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .tile .v { font-size: 30px; font-weight: 600; margin: 4px 0 2px; }
  .tile .d { font-size: 13px; color: var(--ink-2); }
  .tile .d .up { color: var(--good); font-weight: 600; } .tile .d .down { color: var(--bad); font-weight: 600; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 16px 8px; margin: 0 0 18px; }
  .card h2 { font-size: 17px; margin: 0 0 2px; }
  .card p.note { margin: 0 0 10px; color: var(--ink-2); font-size: 13px; }
  .card .bar { display:flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .toggle { font: inherit; font-size: 13px; color: var(--ink-2); background: none; border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .toggle:hover { color: var(--ink); }
  .plot { width: 100%; min-height: 340px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 8px 0 12px; }
  th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; }
  .hidden { display: none; }
  footer { color: var(--muted); font-size: 12.5px; padding: 12px 16px 40px; }
  footer a, .card a { color: var(--ink-2); }
  .flag { display:inline-block; font-size: 11px; color: var(--ink-2); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: middle; }
</style>
</head>
<body>
<header>
  <h1>TRPL Visitor Trends</h1>
  <p class="sub" id="subtitle">Loading…</p>
  <div class="tiles" id="tiles"></div>
</header>
<main id="main"></main>
<footer id="footer"></footer>

<script>
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt = (n) => n == null ? "–" : Math.round(n).toLocaleString("en-US");
const pctTxt = (p) => p == null ? "–" : (p > 0 ? "+" : "") + p.toFixed(1) + "%";
const pctSpan = (p) => p == null ? "–" : `<span class="${p >= 0 ? "up" : "down"}">${pctTxt(p)}</span>`;
const SLOT = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];

function baseLayout(extra) {
  return Object.assign({
    paper_bgcolor: css("--surface"), plot_bgcolor: css("--surface"),
    font: { family: 'system-ui, -apple-system, "Segoe UI", sans-serif', size: 12.5, color: css("--ink-2") },
    margin: { l: 56, r: 16, t: 8, b: 44 }, hovermode: "x unified",
    hoverlabel: { bgcolor: css("--surface"), bordercolor: css("--axis"), font: { color: css("--ink") } },
    legend: { orientation: "h", y: -0.18, x: 0, font: { color: css("--ink-2") } },
    xaxis: { gridcolor: css("--grid"), linecolor: css("--axis"), zeroline: false, tickfont: { color: css("--muted") } },
    yaxis: { gridcolor: css("--grid"), linecolor: css("--axis"), zeroline: false, tickfont: { color: css("--muted") }, tickformat: ",~s" },
  }, extra || {});
}
const CONFIG = { displayModeBar: false, responsive: true };

function card(id, title, note) {
  const el = document.createElement("section");
  el.className = "card";
  el.innerHTML = `<div class="bar"><h2>${title}</h2><button class="toggle" data-for="${id}">Table</button></div>
    <p class="note">${note}</p><div class="plot" id="${id}"></div><div class="tbl hidden" id="${id}-tbl"></div>`;
  document.getElementById("main").appendChild(el);
  el.querySelector(".toggle").addEventListener("click", (e) => {
    const p = el.querySelector(".plot"), t = el.querySelector(".tbl");
    const showTbl = t.classList.contains("hidden");
    t.classList.toggle("hidden", !showTbl); p.classList.toggle("hidden", showTbl);
    e.target.textContent = showTbl ? "Chart" : "Table";
    if (!showTbl) Plotly.Plots.resize(p);
  });
  return el;
}
function table(id, head, rows) {
  document.getElementById(id + "-tbl").innerHTML = `<table><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td>${i ? (typeof c === "number" ? fmt(c) : (c ?? "–")) : c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}

async function main() {
  const d = await (await fetch("data/dashboard.json")).json();
  const thro = d.parks.find(p => p.code === "THRO");
  const controls = d.parks.filter(p => p.role === "control");
  const anomalous = new Set(d.parks.filter(p => p.flag).map(p => p.code));
  const cleanControls = controls.filter(p => !anomalous.has(p.code));
  const ctrlPct = cleanControls.map(p => p.kpi.post_opening.pct).filter(v => v != null).sort((a, b) => a - b);
  const ctrlMedian = ctrlPct.length ? ctrlPct[Math.floor(ctrlPct.length / 2)] : null;
  const cur = d.current_year, prev = cur - 1;
  const k = thro.kpi;

  document.getElementById("subtitle").innerHTML =
    `Theodore Roosevelt National Park and regional indicators, through <b>${d.latest_month_label}</b>. The Library opened <b>July 4, ${cur}</b>.`;

  const L = d.library;
  const capLatest = L && L.capture && L.capture.length ? L.capture[L.capture.length - 1] : null;
  const libTiles = L && L.since_opening ? [
    ["Library attendance since opening", fmt(L.since_opening.visitors), `${L.since_opening.days} days through ${L.as_of}`],
    ["Capture rate, " + (capLatest ? MON[capLatest.month - 1] : "–"), capLatest ? capLatest.capture_pct.toFixed(0) + "%" : "–", capLatest ? `Library ÷ TRNP visits (${fmt(capLatest.library)} ÷ ${fmt(capLatest.trnp)})` : "needs NPS month"],
  ] : [];
  document.getElementById("tiles").innerHTML = [...libTiles, 
    ["TRNP, " + MON[k.latest.month - 1] + " " + cur, fmt(k.latest.cur), `${pctSpan(k.latest.prev ? (k.latest.cur - k.latest.prev) / k.latest.prev * 100 : null)} vs ${MON[k.latest.month - 1]} ${prev}`],
    ["TRNP since opening (Jul–" + MON[k.post_opening.months.at(-1) - 1] + ")", fmt(k.post_opening.cur), `${pctSpan(k.post_opening.pct)} vs same months ${prev}`],
    ["TRNP year to date", fmt(k.ytd.cur), `${pctSpan(k.ytd.pct)} vs Jan–${MON[k.ytd.months.at(-1) - 1]} ${prev}`],
    ["Control parks, same months", pctTxt(ctrlMedian), `median of ${cleanControls.length} regional parks vs ${prev}`],
  ].map(([kk, v, dd]) => `<div class="tile"><div class="k">${kk}</div><div class="v">${v}</div><div class="d">${dd}</div></div>`).join("");

  // ---- Chart 0: Library daily attendance since opening
  if (L && L.daily_since_opening && L.daily_since_opening.dates.length) {
    const D = L.daily_since_opening;
    const srcNote = String(L.visitors_source).startsWith("checked_in") ? "Attendance = checked-in scans from ACME's TicketAnalytics collection (the figure that reconciles with the PE: Tickets Checked In report). Tickets sold run higher; the gap is no-shows and unscanned entries." : `Attendance source in this snapshot: "${L.visitors_source}" — reconcile against the PE: Tickets Checked In report before quoting.`;
    card("c0", "Library attendance, daily since opening",
      `Bars = daily checked-in attendance, line = 7-day average. ${srcNote} Peak day: ${L.peak_day ? MON[+L.peak_day.date.slice(5, 7) - 1] + " " + +L.peak_day.date.slice(8) + " (" + fmt(L.peak_day.visitors) + ")" : "–"}. Capture rate by month is in the table.`);
    Plotly.newPlot("c0", [
      { x: D.dates, y: D.visitors, type: "bar", name: "Daily attendance", marker: { color: css("--band").replace("0.14", "0.55").replace("0.18", "0.6") }, hovertemplate: "%{y:,}" },
      { x: D.dates, y: D.ma7, mode: "lines", name: "7-day average", line: { color: css("--s1"), width: 2.5 }, hovertemplate: "%{y:,}" },
    ], baseLayout({ bargap: 0.15, xaxis: { gridcolor: css("--grid"), linecolor: css("--axis"), tickfont: { color: css("--muted") }, tickformat: "%b %d" } }), CONFIG);
    table("c0", ["Month", "Library attendance", "TRNP recreation visits", "Capture rate"], (L.capture || []).map(r => [MON[r.month - 1], r.library, r.trnp, r.capture_pct.toFixed(1) + "%"]));
    if (L.origin && L.origin.rows.length) {
      const el = document.createElement("section"); el.className = "card";
      el.innerHTML = `<h2>Where Library visitors come from (through ${L.origin.as_of})</h2>
        <p class="note">${L.origin.basis}. ${L.origin.new_market_share != null ? `<b>${L.origin.new_market_share.toFixed(1)}%</b> of tickets came from outside ND, MN, SD, and MT (the "new-market share" metric); Canada ${L.origin.canada_share.toFixed(1)}%.` : ""} Compare with Cottonwood campers and Montana's survey further down.</p>
        <table><thead><tr><th>State</th><th>Share</th><th>Visitors</th></tr></thead><tbody>${L.origin.rows.slice(0, 12).map(r => `<tr><td>${r.state}</td><td>${r.share.toFixed(1)}%</td><td>${fmt(r.visitors)}</td></tr>`).join("")}</tbody></table>`;
      document.getElementById("main").appendChild(el);
    }
  }

  // ---- Origin geography: drive radius, feeder metros, US map
  const G = d.origin_geo;
  if (G && G.bands && G.bands.length) {
    const asOf = L && L.origin ? L.origin.as_of : d.latest_month_label;
    card("cg1", "How far Library visitors travel",
      `Tickets since opening by straight-line distance from Medora to the buyer's ZIP (through ${asOf}). Straight-line miles run about 15–20% under road miles, so the 0–50 band is roughly a one-hour drive and 300–600 is a full day. ${G.geocoded_share.toFixed(1)}% of ${fmt(G.total_tickets)} tickets had a mappable ZIP; the rest are Canadian postal codes, blanks, or typos.`);
    Plotly.newPlot("cg1", [{
      x: G.bands.map(b => b.band), y: G.bands.map(b => b.share), type: "bar", name: "Share of tickets",
      marker: { color: css("--s1") }, text: G.bands.map(b => b.share.toFixed(1) + "%"), textposition: "outside", textfont: { color: css("--ink-2") },
      customdata: G.bands.map(b => b.tickets), hovertemplate: "%{x}: %{y:.1f}% (%{customdata:,} tickets)<extra></extra>",
    }], baseLayout({ showlegend: false, bargap: 0.3, hovermode: "closest", yaxis: { gridcolor: css("--grid"), linecolor: css("--axis"), zeroline: false, tickfont: { color: css("--muted") }, ticksuffix: "%", range: [0, Math.max(...G.bands.map(b => b.share)) * 1.18] } }), CONFIG);
    table("cg1", ["Distance from Medora", "Tickets", "Share"], G.bands.map(b => [b.band, b.tickets, b.share.toFixed(1) + "%"]));

    if (G.points && G.points.lat && G.points.lat.length) {
      card("cg2", "Where tickets were bought, by ZIP",
        `Each bubble is a buyer ZIP, sized by tickets since opening (top ${fmt(G.points.lat.length)} ZIPs shown). Hover for the place name. Canadian buyers are not on the map.`);
      const maxT = Math.max(...G.points.tickets);
      Plotly.newPlot("cg2", [
        { type: "scattergeo", lat: G.points.lat, lon: G.points.lon, mode: "markers", name: "ZIP",
          text: G.points.label, customdata: G.points.tickets, hovertemplate: "%{text}<br>%{customdata:,} tickets<extra></extra>",
          marker: { size: G.points.tickets.map(t => 3 + 26 * Math.sqrt(t / maxT)), color: css("--s1"), opacity: 0.45, line: { width: 0 } } },
        { type: "scattergeo", lat: [G.medora.lat], lon: [G.medora.lon], mode: "markers", name: "Medora",
          hovertemplate: "Medora, ND<extra></extra>", marker: { size: 12, color: css("--s2"), symbol: "star", line: { width: 1, color: css("--surface") } } },
      ], baseLayout({ showlegend: false, hovermode: "closest", margin: { l: 0, r: 0, t: 0, b: 0 }, height: 520,
        geo: { scope: "usa", bgcolor: css("--surface"), showland: true, landcolor: css("--grid"), showlakes: true, lakecolor: css("--surface"),
               subunitcolor: css("--axis"), countrycolor: css("--axis"), showcountries: true, showframe: false } }), CONFIG);
      table("cg2", ["Metro", "Tickets", "Share", "Miles from Medora"], (G.feeders || []).map(f => [f.metro, f.tickets, f.share.toFixed(1) + "%", f.miles]));
    }

    if (G.feeders && G.feeders.length) {
      const el = document.createElement("section"); el.className = "card";
      el.innerHTML = `<h2>Feeder markets</h2>
        <p class="note">Tickets since opening grouped by the buyer ZIP's county, mapped to its metro area. The right-hand column is straight-line distance from Medora. Metros outside the list are in the state table above.</p>
        <table><thead><tr><th>Metro</th><th>Share</th><th>Tickets</th><th>Miles</th></tr></thead><tbody>${G.feeders.slice(0, 20).map(f => `<tr><td>${f.metro}</td><td>${f.share.toFixed(1)}%</td><td>${fmt(f.tickets)}</td><td>${fmt(f.miles)}</td></tr>`).join("")}</tbody></table>`;
      document.getElementById("main").appendChild(el);
    }
  }

  // ---- Chart 1: TRNP monthly vs pre-opening band
  card("c1", "Theodore Roosevelt NP, monthly recreation visits",
    `${cur} against the pre-opening range (${d.band_years.join(", ")}; 2020–21 excluded). Shaded band = min to max of those years. Source: NPS IRMA STATS.`);
  const bandMin = thro.band.map(b => b ? b.min : null), bandMax = thro.band.map(b => b ? b.max : null);
  Plotly.newPlot("c1", [
    { x: MON, y: bandMax, mode: "lines", line: { width: 0 }, hoverinfo: "skip", showlegend: false },
    { x: MON, y: bandMin, mode: "lines", line: { width: 0 }, fill: "tonexty", fillcolor: css("--band"), name: "Pre-opening range", hoverinfo: "skip" },
    { x: MON, y: thro.years[String(prev)], mode: "lines", name: String(prev), line: { color: css("--gray-mark"), width: 2 }, hovertemplate: "%{y:,}" },
    { x: MON, y: thro.years[String(cur)], mode: "lines+markers", name: String(cur), line: { color: css("--s1"), width: 2.5 }, marker: { size: 8, line: { color: css("--surface"), width: 2 } }, hovertemplate: "%{y:,}" },
  ], baseLayout({
    shapes: [{ type: "line", x0: 6, x1: 6, xref: "x", y0: 0, y1: 1, yref: "paper", line: { color: css("--axis"), width: 1 } }],
    annotations: [{ x: 6, y: 1, xref: "x", yref: "paper", text: "Library opens", showarrow: false, xanchor: "left", yanchor: "top", xshift: 6, font: { size: 12, color: css("--muted") } }],
  }), CONFIG);
  table("c1", ["Month", String(prev), String(cur), "Change", "Band min", "Band max"], MON.map((m, i) => {
    const a = thro.years[String(cur)][i], b = thro.years[String(prev)][i];
    return [m, b, a, a != null && b ? pctTxt((a - b) / b * 100) : "–", bandMin[i], bandMax[i]];
  }));

  // ---- Chart 2: post-opening change by park
  const months = k.post_opening.months;
  const label = `Jul–${MON[months.at(-1) - 1]} ${cur} vs ${prev}`;
  card("c2", `Change since opening, by park (${label})`,
    `Recreation visits in the months since July 4, each park against the same months of ${prev}. Yellowstone is through July only.` +
    (anomalous.size ? ` <span class="flag">flag</span> ${[...anomalous].map(c => d.parks.find(p => p.code === c).name).join(", ")}: ${prev} counts look like a counter outage and are excluded from the control median.` : ""));
  const ranked = [...d.parks].filter(p => p.kpi.post_opening.pct != null).sort((a, b) => a.kpi.post_opening.pct - b.kpi.post_opening.pct);
  Plotly.newPlot("c2", [{
    type: "bar", orientation: "h",
    y: ranked.map(p => p.name + (anomalous.has(p.code) ? " ⚑" : "")), x: ranked.map(p => p.kpi.post_opening.pct),
    marker: { color: ranked.map(p => p.code === "THRO" ? css("--s1") : css("--gray-mark")) },
    text: ranked.map(p => pctTxt(p.kpi.post_opening.pct)), textposition: "outside", textfont: { color: css("--ink-2") },
    cliponaxis: false, hovertemplate: "%{y}<br>%{x:+.1f}%<extra></extra>",
  }], baseLayout({
    hovermode: "closest", margin: { l: 210, r: 60, t: 8, b: 40 }, showlegend: false, bargap: 0.35,
    xaxis: { ticksuffix: "%", gridcolor: css("--grid"), zeroline: true, zerolinecolor: css("--axis"), tickfont: { color: css("--muted") },
      range: [Math.min(0, ...ranked.map(p => p.kpi.post_opening.pct)) * 1.9 - 4, Math.max(0, ...ranked.map(p => p.kpi.post_opening.pct)) * 1.18 + 4] },
    yaxis: { tickfont: { color: css("--ink-2") }, automargin: true },
  }), CONFIG);
  table("c2", ["Park", `${label.split(" vs ")[0]}`, `Same months ${prev}`, "Change"], ranked.map(p => [p.name, p.kpi.post_opening.cur, p.kpi.post_opening.prev, pctTxt(p.kpi.post_opening.pct)]));

  // ---- Chart 3: monthly YoY by park
  card("c3", `Monthly change vs ${prev}, by park (Apr–Oct)`,
    `Year-over-year change in recreation visits for each ${cur} season month. Winter months are omitted: a few hundred visits swing the percentage wildly. Theodore Roosevelt NP in blue; the others are the regional comparison set.` +
    (anomalous.size ? ` ${[...anomalous].map(c => d.parks.find(p => p.code === c).name).join(", ")} omitted (flagged above).` : ""));
  const c3parks = d.parks.filter(p => !anomalous.has(p.code));
  const SEASON = [3, 4, 5, 6, 7, 8, 9]; // Apr..Oct (0-based)
  Plotly.newPlot("c3", c3parks.map((p, i) => ({
    x: SEASON.map(m => MON[m]), y: SEASON.map(m => p.yoy_pct[m]), mode: "lines+markers", name: p.name,
    line: { color: css(SLOT[i % 8]), width: p.code === "THRO" ? 3 : 1.5 },
    marker: { size: p.code === "THRO" ? 8 : 6, line: { color: css("--surface"), width: 2 } },
    hovertemplate: "%{y:+.1f}%",
  })), baseLayout({
    yaxis: { ticksuffix: "%", gridcolor: css("--grid"), zeroline: true, zerolinecolor: css("--axis"), tickfont: { color: css("--muted") } },
    legend: { orientation: "h", y: -0.22, x: 0 }, margin: { l: 56, r: 16, t: 8, b: 70 },
  }), CONFIG);
  table("c3", ["Month", ...c3parks.map(p => p.code)], SEASON.map(i => [MON[i], ...c3parks.map(p => p.yoy_pct[i] == null ? "–" : pctTxt(p.yoy_pct[i]))]));

  // ---- Shared: current year vs prior year vs historical band
  function seasonalChart(id, xLabels, shaped, cur, opts) {
    opts = opts || {};
    const prev = cur - 1;
    const bandMin = shaped.band.map(b => b ? b.min : null), bandMax = shaped.band.map(b => b ? b.max : null);
    const yc = shaped.years[String(cur)] || [], yp = shaped.years[String(prev)] || [];
    const hover = opts.hover || "%{y:,}";
    const hasBand = shaped.band_years && shaped.band_years.length && bandMax.some(v => v != null);
    const traces = [
      ...(hasBand ? [
      { x: xLabels, y: bandMax, mode: "lines", line: { width: 0 }, hoverinfo: "skip", showlegend: false },
      { x: xLabels, y: bandMin, mode: "lines", line: { width: 0 }, fill: "tonexty", fillcolor: css("--band"), name: `${shaped.band_years[0]}–${shaped.band_years.at(-1)} range`, hoverinfo: "skip" }] : []),
      { x: xLabels, y: yp, mode: "lines", name: String(prev), line: { color: css("--gray-mark"), width: 2 }, hovertemplate: hover },
      { x: xLabels, y: yc, mode: "lines+markers", name: String(cur), line: { color: css("--s1"), width: 2.5 }, marker: { size: 8, line: { color: css("--surface"), width: 2 } }, hovertemplate: hover },
    ];
    const layout = baseLayout({ yaxis: Object.assign({ gridcolor: css("--grid"), linecolor: css("--axis"), zeroline: false, tickfont: { color: css("--muted") }, tickformat: ",~s", rangemode: "tozero" }, opts.yaxis || {}) });

    const f = opts.fmt || fmt;
    table(id, [opts.periodName || "Period", String(prev), String(cur), "Change", "Range min", "Range max"], xLabels.map((l, i) => {
      const a = yc[i], b = yp[i];
      return [l, f(b), f(a), a != null && b ? pctTxt((a - b) / b * 100) : "–", f(bandMin[i]), f(bandMax[i])];
    }));
  }
  const QTR = ["Q1", "Q2", "Q3", "Q4"];
  const money = (n) => n == null ? "–" : "$" + Math.round(n).toLocaleString("en-US");
  const pct1 = (n) => n == null ? "–" : n.toFixed(1) + "%";

  // ---- Chart 4: ND border crossings
  const nd = d.border.states["North Dakota"];
  card("c4", "Canadian visitors: personal vehicles entering North Dakota",
    `Monthly inbound personal-vehicle crossings at all ND land ports (Pembina and Portal are the largest), ${cur} against ${prev} and the ${nd.band_years[0]}–${nd.band_years.at(-1)} range. Context for the Canadian market, not a Library indicator. Source: BTS Border Crossing Entry Data, through ${d.border.latest_month}.`);

  // ---- Chart 5: Billings County taxable sales
  if (d.nd_tax && d.nd_tax.counties && d.nd_tax.counties.Billings) {
    const b = d.nd_tax.counties.Billings;
    card("c5", "Billings County taxable sales and purchases, by quarter",
      `Reported to the ND Tax Commissioner. Billings County is mostly Medora commerce, so this is the closest public proxy for visitor spending in town. ${cur} against ${prev} and the ${b.band_years[0]}–${b.band_years.at(-1)} range. Q3 (Jul–Sep) is the first post-opening quarter and posts in December. Through ${d.nd_tax.latest_quarter}.`);
    seasonalChart("c5", QTR, b, cur, { periodName: "Quarter", hover: "$%{y:,.0f}", fmt: money, yaxis: { tickprefix: "$" }, openingIndex: 2 });
  }

  // ---- Charts 5c-5e: Medora and corridor towns (Treasurer distributions)
  if (d.nd_city && d.nd_city.cities && d.nd_city.cities.Medora) {
    const nc = d.nd_city, ycur = nc.current_year, lm = nc.latest_month;
    const med = nc.cities.Medora;
    const lagNote = `Payments lag sales by about two months and quarterly filers land in the fall payments, so read year-to-date and same-month comparisons, not single months. Source: ND State Treasurer distribution search, payments through ${nc.latest_payment}.`;
    card("c5c", "Medora city sales tax, monthly payments to the city",
      `The one public series at the town level: what the State Treasurer paid the City of Medora each month from its local sales tax, ${ycur} against ${ycur - 1} and the ${med.sales.band_years[0]}–${med.sales.band_years.at(-1)} range. ${lagNote}`);
    seasonalChart("c5c", MON, med.sales, ycur, { periodName: "Payment month", hover: "$%{y:,.0f}", fmt: money, yaxis: { tickprefix: "$" }, openingIndex: 6 });
    if (med.occupancy) {
      card("c5d", "Medora occupancy (lodging) tax, monthly payments to the city",
        `City/County Occupancy tax distributed to Medora: the lodging read. ${ycur} against ${ycur - 1} and the ${med.occupancy.band_years[0]}–${med.occupancy.band_years.at(-1)} range. ${lagNote}`);
      seasonalChart("c5d", MON, med.occupancy, ycur, { periodName: "Payment month", hover: "$%{y:,.0f}", fmt: money, yaxis: { tickprefix: "$" }, openingIndex: 6 });
    }
    const ytd = nc.ytd.filter(r => r.sales_ytd_pct != null).sort((a, b) => a.sales_ytd_pct - b.sales_ytd_pct);
    card("c5e", `Corridor towns: city sales tax paid, Jan–${MON[lm - 1]} ${ycur} vs ${ycur - 1}`,

    Plotly.newPlot("c5e", [{
      type: "bar", orientation: "h", y: ytd.map(r => `${r.city} (${r.county} Co.)`), x: ytd.map(r => r.sales_ytd_pct),
      marker: { color: ytd.map(r => r.city === "Medora" ? css("--s1") : css("--gray-mark")) },
      text: ytd.map(r => pctTxt(r.sales_ytd_pct)), textposition: "outside", textfont: { color: css("--ink-2") }, cliponaxis: false,
      customdata: ytd.map(r => [r.sales_ytd_cur, r.sales_ytd_prev]), hovertemplate: "%{y}<br>%{x:+.1f}%<br>$%{customdata[0]:,} vs $%{customdata[1]:,}<extra></extra>",
    }], baseLayout({
      hovermode: "closest", margin: { l: 200, r: 60, t: 8, b: 40 }, showlegend: false, bargap: 0.35,

      yaxis: { tickfont: { color: css("--ink-2") }, automargin: true },

    table("c5e", ["Town", `Sales tax YTD ${ycur}`, `YTD ${ycur - 1}`, "Change", `Occupancy YTD ${ycur}`, `YTD ${ycur - 1}`, "Change"],
      ytd.slice().reverse().map(r => [`${r.city} (${r.county})`, money(r.sales_ytd_cur), money(r.sales_ytd_prev), pctTxt(r.sales_ytd_pct), money(r.occupancy_ytd_cur), money(r.occupancy_ytd_prev), pctTxt(r.occupancy_ytd_pct)]));
  }

  // ---- Chart 5f: corridor counties, taxable sales YTD
  if (d.nd_counties && d.nd_counties.ytd && d.nd_counties.ytd.length) {

    const rk = C.ytd.slice().sort((a, b) => a.pct - b.pct);
    card("c5f", `Corridor counties: taxable sales and purchases, Q1–Q${C.latest_quarter} ${cy} vs ${cy - 1}`,

    Plotly.newPlot("c5f", [{
      type: "bar", orientation: "h", y: rk.map(r => r.county), x: rk.map(r => r.pct),

    if (d.nd_tax.counties.Stark) {

  // ---- Chart 5b: ND statewide Accommodation & Food Services

  // ---- Chart 6: Montana nonresident survey — the ND corridor
  if (d.mt && d.mt.i94_from_nd) {

  // ---- Chart 7: Montana nonresident visitation, monthly

    Plotly.newPlot("c8", names.map((n, i) => ({
      x: d.wy.counties[n].years, y: d.wy.counties[n].index_2019, mode: "lines+markers", name: n,

    const yrs8 = d.wy.counties[names[0]].years;

  // ---- Airports: monthly (T-100) and annual (FAA)

      hovermode: "closest", margin: { l: 60, r: 60, t: 8, b: 40 }, showlegend: false, bargap: 0.35,

        range: [Math.min(0, ...ranked.map(r => r.pct)) * 1.9 - 4, Math.max(0, ...ranked.map(r => r.pct)) * 1.18 + 4] },

    for (const [code, label] of [["BIS", "Bismarck (BIS)"], ["DIK", "Dickinson (DIK)"]]) {

        <table><thead><tr><th>Year</th>${codes.map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>
        ${yrs.slice().reverse().map(y => `<tr><td>${y}</td>${codes.map(c => { const i = A.annual[c].years.indexOf(y); return `<td>${i >= 0 ? fmt(A.annual[c].enplanements[i]) : "–"}</td>`; }).join("")}</tr>`).join("")}</tbody></table>`;

  // ---- NDDOT: I-94 at Medora
  if (d.nddot && d.nddot.stations && d.nddot.stations["00279"]) {
    const st = d.nddot.stations["00279"], ny = d.nddot.current_year;
    card("c10", "I-94 traffic at Medora (NDDOT counter 279, Painted Canyon), average daily vehicles by month",
      `Month average daily traffic on I-94 7.8 miles west of US 85, both directions, from NDDOT's monthly Automatic Traffic Data reports. ${ny} against ${ny - 1}. NDDOT had not posted 2026 reports when this was built; they are picked up automatically when they appear. Weekend averages are in the table.`);
    seasonalChart("c10", MON, st.madt, ny, Object.assign({ periodName: "Month" }, ny === cur ? { openingIndex: 6 } : {}));
    const wk = st.weekend.years;

      const a = st.madt.years[String(ny)]?.[i], b = st.madt.years[String(ny - 1)]?.[i];

  }

  // ---- QCEW: county tourism employment
  if (d.qcew && d.qcew.counties && d.qcew.counties.Billings) {
    const Q = d.qcew, qy = Q.current_year;
    card("c11", "Billings County leisure and hospitality jobs, by quarter",
      `Average monthly employment in leisure and hospitality (hotels, restaurants, recreation) from BLS QCEW. This is the county-level tourism-sector series the tax data cannot give: about a five-month lag, through ${qy} Q${Q.latest_quarter}. ${qy} against ${qy - 1} and the ${Q.counties.Billings.band_years[0]}–${Q.counties.Billings.band_years.at(-1)} range. Other counties in the table.`);
    seasonalChart("c11", QTR, Q.counties.Billings, qy, Object.assign({ periodName: "Quarter", hover: "%{y:,.0f} jobs" }, qy === cur ? { openingIndex: 2 } : {}));
    const lr = Q.latest.slice().sort((a, b) => b.pct - a.pct);

  }

  // ---- Recreation.gov campgrounds
  if (d.recgov && d.recgov.facilities && d.recgov.facilities["Cottonwood Campground"]) {
    const R = d.recgov, ry = R.current_year;
    for (const [f, label] of [["Cottonwood Campground", "Cottonwood Campground (TRNP South Unit)"], ["Buffalo Gap Campground", "Buffalo Gap Campground (USFS, west of Medora)"]]) {
      if (!R.facilities[f]) continue;

        `Reservations starting each month, from Recreation.gov's public reservation history. ${ry} against ${ry - 1} and the ${R.facilities[f].band_years[0]}–${R.facilities[f].band_years.at(-1)} range. Campgrounds sell out in July–August, so this is a floor on demand, not a measure of it; the origin mix is the real value.`);
      seasonalChart("c12" + f.slice(0, 3), MON, R.facilities[f], ry, { periodName: "Arrival month" });

        <table><thead><tr><th>State</th><th>Share</th><th>Reservations</th></tr></thead><tbody>${R.origin.rows.map(r => `<tr><td>${r.state}</td><td>${r.share.toFixed(1)}%</td><td>${fmt(r.n)}</td></tr>`).join("")}</tbody></table>`;
      document.getElementById("main").appendChild(el);

  }

  // ---- Interest: Wikipedia and Google Trends
  if (d.interest && d.interest.wiki && d.interest.wiki.articles["Theodore_Roosevelt_Presidential_Library"]) {
    const W = d.interest.wiki, wy = W.current_year, wa = W.articles["Theodore_Roosevelt_Presidential_Library"];

    if (W.articles["Medora,_North_Dakota"]) {

      seasonalChart("c13m", MON, W.articles["Medora,_North_Dakota"], wy, { periodName: "Month", openingIndex: 6 });

  }
  if (d.interest && d.interest.trends && d.interest.trends.terms) {

    card("c14", "Google search interest, weekly (U.S.)",

    Plotly.newPlot("c14", names.map((n, i) => ({ x: T.terms[n].weeks, y: T.terms[n].interest, mode: "lines", name: n, line: { color: css(SLOT[i]), width: n === T.primary_term ? 2.5 : 1.5 }, hovertemplate: "%{y}" })),

  }

  // ---- Controls table
  if (d.controls && d.controls.years) {
    const K = d.controls, ky = K.current_year, Y = K.years;

      ${MON.map((m, i) => `<tr><td>${m}</td>${K.columns.map(c => { const a = Y[String(ky - 1)][c][i], b = Y[String(ky)][c][i]; const f = v => v == null ? "–" : (c === "cad_per_usd" ? v.toFixed(3) : c === "gas_midwest_usd" ? "$" + v.toFixed(2) : c === "nd_oil_bbl_per_day" ? fmt(v / 1000) + "k" : fmt(v)); return `<td>${f(a)} / <b>${f(b)}</b></td>`; }).join("")}</tr>`).join("")}</tbody></table>`;
